[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotab"
version = "0.1.0"
description = "Turn an online video or audio link into guitar sheet music or tablature."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "yt-dlp",
    "basic-pitch",
    "music21"
]

[tool.setuptools]
packages = ["audiotab"]

[project.scripts]
audiotab = "audiotab.main:main"